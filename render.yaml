services:
  - type: web
    name: wisp
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_OPTIONS
        value: "--max-old-space-size=4096"
      - key: NEW_API_KEY
        sync: false
      - key: TABITOKEN_API_KEY
        sync: false
      - key: TOKENROUTER_API_KEY
        sync: false
      - key: ORCAROUTER_API_KEY
        sync: false
